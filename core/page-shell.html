<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{pageTitle}}</title>
    <meta name="description" content="{{pageDescription}}" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Link preview in email / Teams / Slack (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{pageTitle}}" />
    <meta property="og:description" content="{{pageDescription}}" />
    <meta property="og:image" content="{{ogImage}}" />
    <meta property="og:image:alt" content="{{ogImageAlt}}" />
    {{ogUrlTag}}
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{pageTitle}}" />
    <meta name="twitter:image" content="{{ogImage}}" />

    <!-- ==================================================================
         TRACKER SNIPPET SLOT
         Paste the Synerise (SR) snippet here.
         core/tracker.js pushes events to window.dataLayer when it exists.
         ================================================================== -->
    <!-- /END TRACKER SNIPPET SLOT -->

    <style>
      {{css}}
    </style>
  </head>
  <body>
    {{mock}}

    <!-- Widget templates -->
    {{templates}}

    <!-- Toast + screen-reader live region -->
    <div class="roi-toast" id="roi-toast" role="status" aria-live="polite"></div>

    <!-- Data from build.js -->
    <script>
      window.ROI_CONFIG = {{configJson}};
      window.ROI_PRODUCTS = {{productsJson}};
    </script>

    <!-- core/tracker.js + core/carousel.js + widget.js -->
    <script>
      {{js}}
    </script>
  </body>
</html>
