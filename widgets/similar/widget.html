<!-- Widget: Similar products -->
<section class="w-widget w-similar" id="{{widgetId}}" aria-labelledby="{{widgetId}}-title" data-widget="similar">
  <h2 class="w-title" id="{{widgetId}}-title">{{title}}</h2>
  {{subtitleHtml}}
  <div class="w-carousel" data-carousel>
    <!-- DOM order = Tab order: prev → cards → next -->
    <button class="w-carousel__arrow w-carousel__arrow--prev" type="button" data-carousel-prev aria-label="{{labelPrev}}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="w-carousel__viewport" data-carousel-viewport tabindex="0" role="region" aria-roledescription="karuzela" aria-label="{{title}}">
      <!-- cards rendered by widget.js -->
    </div>
    <button class="w-carousel__arrow w-carousel__arrow--next" type="button" data-carousel-next aria-label="{{labelNext}}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>
  <!-- Dashes: mobile only (hidden on desktop in widget.css) -->
  <ol class="w-dots" data-carousel-dots aria-label="{{labelDots}}"></ol>
</section>
