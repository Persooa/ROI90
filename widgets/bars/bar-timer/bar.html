<style>
  .rk-bar {
    --rk-b-bg: var(--rk-bar-bg, var(--rk-accent, #111));
    --rk-b-fg: var(--rk-bar-text, #fff);
    position: sticky;
    top: 0;
    z-index: 1000;
    width: 100%;
    background: var(--rk-b-bg);
    color: var(--rk-b-fg);
    font: 14px/1.3 var(--rk-font, system-ui, -apple-system, "Segoe UI", sans-serif)
  }

  .rk-bar, .rk-bar * {
    box-sizing: border-box
  }

  .rk-bar[hidden], .rk-bar [hidden] {
    display: none !important
  }

  .rk-bar__inner {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 20px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 10px 48px 10px 16px;
    min-height: 48px
  }

  .rk-bar__text {
    margin: 0;
    text-align: center
  }

  .rk-bar__text strong {
    font-weight: 700;
    margin-right: 6px
  }

  .rk-bar__cta {
    appearance: none;
    border: 0;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    padding: 8px 18px;
    background: var(--rk-b-fg);
    color: var(--rk-b-bg);
    font: inherit;
    font-weight: 700;
    border-radius: var(--rk-radius, 6px);
    white-space: nowrap
  }

  .rk-bar__cta:hover {
    opacity: .9
  }

  .rk-bar__cta:focus-visible, .rk-bar__close:focus-visible {
    outline: 2px solid var(--rk-b-fg);
    outline-offset: 2px
  }

  .rk-bar__close {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    border: 0;
    background: transparent;
    color: inherit;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    opacity: .8
  }

  .rk-bar__close:hover {
    opacity: 1
  }

  .rk-timer {
    display: inline-flex;
    align-items: center;
    gap: 6px
  }

  .rk-timer__seg {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 46px;
    padding: 3px 6px;
    background: rgba(255, 255, 255, .18);
    border-radius: min(var(--rk-radius, 6px), 10px)
  }

  .rk-timer__seg b {
    font: 700 18px/1.15 var(--rk-font, system-ui, sans-serif);
    font-variant-numeric: tabular-nums
  }

  .rk-timer__seg small {
    font-size: 10px;
    line-height: 1.2;
    text-transform: uppercase;
    letter-spacing: .04em;
    opacity: .85
  }

  .rk-timer__sep {
    font-weight: 700;
    opacity: .7
  }

  @media (max-width: 640px) {
    .rk-bar {
      font-size: 13px
    }

    .rk-bar__inner {
      padding: 10px 40px 10px 12px;
      gap: 8px 12px
    }

    .rk-bar__close {
      top: 8px;
      transform: none;
      right: 4px
    }

    .rk-timer__seg {
      min-width: 40px
    }

    .rk-timer__seg b {
      font-size: 16px
    }
  }
</style>

<div class="rk-bar rk-bar--timer" data-rk-bar="timer" role="region" aria-label="Wyprzedaż">
  <div class="rk-bar__inner">
    <p class="rk-bar__text"><strong>SALE -25%</strong><span
      data-rk-label>Wyprzedaż kończy się za</span></p>
    <div class="rk-timer" role="timer" aria-label="Czas do końca wyprzedaży" data-rk-timer>
      <div class="rk-timer__seg" data-seg="d"><b>00</b><small>dni</small></div>
      <span class="rk-timer__sep" data-sep="d">:</span>
      <div class="rk-timer__seg" data-seg="h"><b>00</b><small>godz</small></div>
      <span class="rk-timer__sep">:</span>
      <div class="rk-timer__seg" data-seg="m"><b>00</b><small>min</small></div>
      <span class="rk-timer__sep">:</span>
      <div class="rk-timer__seg" data-seg="s"><b>00</b><small>sek</small></div>
    </div>
    <a class="rk-bar__cta" href="#" data-rk-cta>Kup teraz</a>
  </div>
  <button class="rk-bar__close" type="button" aria-label="Zamknij belkę" data-rk-close>&times;
  </button>
</div>

<script>
  (function () {
    var bar = document.querySelector('[data-rk-bar="timer"]');
    if (!bar) return;

    var KEY_CLOSED = 'rk_bar_timer_closed';
    var KEY_START = 'rk_bar_timer_start';
    var timerEl = bar.querySelector('[data-rk-timer]');
    var label = bar.querySelector('[data-rk-label]');
    var cta = bar.querySelector('[data-rk-cta]');
    var segs = {};
    ['d', 'h', 'm', 's'].forEach(function (k) {
      segs[k] = bar.querySelector('[data-seg="' + k + '"] b');
    });
    var dayWrap = [bar.querySelector('[data-seg="d"]'), bar.querySelector('[data-sep="d"]')];
    var interval = null;

    function track(name, data) {
      data = data || {};
      if (typeof window.track === 'function') window.track(name, data);
      else console.log('[rk-bar]', name, data);
    }

    function read(k) {
      try {
        return sessionStorage.getItem(k);
      } catch (e) {
        return null;
      }
    }

    function write(k, v) {
      try {
        sessionStorage.setItem(k, v);
      } catch (e) {
      }
    }

    function endTime() {
      var fixed = bar.getAttribute('data-end');
      if (fixed) {
        var t = new Date(fixed).getTime();
        if (!isNaN(t)) return t;
      }
      var dur = parseInt(bar.getAttribute('data-duration'), 10);
      if (dur > 0) {
        var start = parseInt(read(KEY_START), 10);
        if (!start) {
          start = Date.now();
          write(KEY_START, String(start));
        }
        return start + dur * 1000;
      }
      var eod = new Date();
      eod.setHours(23, 59, 59, 999);
      return eod.getTime();
    }

    var end = endTime();

    function pad(n) {
      return n < 10 ? '0' + n : String(n);
    }

    function tick() {
      var left = Math.max(0, Math.floor((end - Date.now()) / 1000));
      var d = Math.floor(left / 86400);
      segs.d.textContent = pad(d);
      segs.h.textContent = pad(Math.floor((left % 86400) / 3600));
      segs.m.textContent = pad(Math.floor((left % 3600) / 60));
      segs.s.textContent = pad(left % 60);
      dayWrap.forEach(function (el) {
        el.hidden = d === 0;
      });   // days only when there are any
      if (left === 0) {
        clearInterval(interval);
        label.textContent = 'Promocja zakończona';
        timerEl.hidden = true;
        cta.hidden = true;
        track('timer.expired', {bar: 'timer'});
      }
    }

    if (read(KEY_CLOSED) === '1') {
      bar.hidden = true;
    } else {
      track('bar.view', {bar: 'timer'});
      tick();
      if (end > Date.now()) interval = setInterval(tick, 1000);
    }

    cta.addEventListener('click', function () {
      track('bar.click', {bar: 'timer'});
    });
    bar.querySelector('[data-rk-close]').addEventListener('click', function () {
      track('bar.close', {bar: 'timer'});
      clearInterval(interval);
      bar.hidden = true;
      write(KEY_CLOSED, '1');
    });
  })();
</script>
