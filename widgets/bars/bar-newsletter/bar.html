<style>
  .rk-bar {
    --rk-b-bg: var(--rk-bar-bg, var(--rk-accent, #111));
    --rk-b-fg: var(--rk-bar-text, #fff);
    position: sticky;
    top: 0;
    z-index: 1000;
    width: 100%;
    background: var(--rk-b-bg);
    color: var(--rk-b-fg);
    font: 14px/1.3 var(--rk-font, system-ui, -apple-system, "Segoe UI", sans-serif)
  }

  .rk-bar, .rk-bar *, .rk-modal, .rk-modal * {
    box-sizing: border-box
  }

  .rk-bar[hidden], .rk-modal[hidden], .rk-modal [hidden] {
    display: none !important
  }

  .rk-bar__inner {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 20px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 10px 48px 10px 16px;
    min-height: 48px
  }

  .rk-bar__text {
    margin: 0;
    text-align: center
  }

  .rk-bar__text strong {
    font-weight: 700;
    margin-right: 6px
  }

  .rk-bar__cta {
    appearance: none;
    border: 0;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    padding: 8px 18px;
    background: var(--rk-b-fg);
    color: var(--rk-b-bg);
    font: inherit;
    font-weight: 700;
    border-radius: var(--rk-radius, 6px);
    white-space: nowrap
  }

  .rk-bar__cta:hover {
    opacity: .9
  }

  .rk-bar__cta:focus-visible, .rk-bar__close:focus-visible {
    outline: 2px solid var(--rk-b-fg);
    outline-offset: 2px
  }

  .rk-bar__close {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    border: 0;
    background: transparent;
    color: inherit;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    opacity: .8
  }

  .rk-bar__close:hover {
    opacity: 1
  }

  .rk-modal {
    position: fixed;
    inset: 0;
    z-index: 1100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(0, 0, 0, .55);
    font: 15px/1.45 var(--rk-font, system-ui, -apple-system, "Segoe UI", sans-serif)
  }

  .rk-modal__dialog {
    position: relative;
    width: 100%;
    max-width: 440px;
    padding: 36px 32px 28px;
    text-align: center;
    background: var(--rk-bg, #fff);
    color: var(--rk-text, #111);
    border-radius: var(--rk-radius, 8px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .35)
  }

  .rk-modal__close {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 36px;
    height: 36px;
    border: 0;
    background: transparent;
    color: inherit;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    opacity: .7
  }

  .rk-modal__close:hover {
    opacity: 1
  }

  .rk-modal__badge {
    display: inline-block;
    margin-bottom: 10px;
    padding: 4px 12px;
    background: var(--rk-accent, #111);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .04em;
    border-radius: var(--rk-radius, 6px)
  }

  .rk-modal__title {
    margin: 0 0 8px;
    font-size: 26px;
    line-height: 1.2
  }

  .rk-modal__lead {
    margin: 0 0 20px;
    opacity: .8
  }

  .rk-modal__input {
    display: block;
    width: 100%;
    padding: 12px 14px;
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid rgba(0, 0, 0, .3);
    border-radius: var(--rk-radius, 6px)
  }

  .rk-modal__input:focus-visible {
    outline: 2px solid var(--rk-accent, #111);
    outline-offset: 1px
  }

  .rk-modal__consent {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    margin: 12px 0 0;
    font-size: 12px;
    text-align: left;
    opacity: .85
  }

  .rk-modal__consent input {
    margin-top: 2px;
    flex: none
  }

  .rk-modal__error {
    min-height: 18px;
    margin: 8px 0 0;
    font-size: 13px;
    color: #c62828;
    text-align: left
  }

  .rk-modal__submit {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 13px 18px;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    background: var(--rk-accent, #111);
    color: #fff;
    border-radius: var(--rk-radius, 6px)
  }

  .rk-modal__submit:hover {
    opacity: .9
  }

  .rk-modal__code {
    display: inline-block;
    margin: 6px 0 14px;
    padding: 8px 18px;
    border: 2px dashed var(--rk-accent, #111);
    font: 700 22px ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .1em;
    border-radius: var(--rk-radius, 6px)
  }

  .rk-modal__small {
    margin: 0;
    font-size: 13px;
    opacity: .75
  }

  @media (max-width: 640px) {
    .rk-bar {
      font-size: 13px
    }

    .rk-bar__inner {
      padding: 10px 40px 10px 12px;
      gap: 8px 12px
    }

    .rk-bar__close {
      top: 8px;
      transform: none;
      right: 4px
    }

    .rk-modal__dialog {
      padding: 32px 20px 22px
    }

    .rk-modal__title {
      font-size: 22px
    }
  }
</style>

<div class="rk-bar rk-bar--newsletter" data-rk-bar="newsletter" role="region"
     aria-label="Newsletter">
  <div class="rk-bar__inner">
    <p class="rk-bar__text"><strong>-10% na pierwsze zamówienie</strong><span>Zapisz się do newslettera</span>
    </p>
    <button class="rk-bar__cta" type="button" data-rk-open>Zapisz się</button>
  </div>
  <button class="rk-bar__close" type="button" aria-label="Zamknij belkę" data-rk-close>&times;
  </button>
</div>

<div class="rk-modal" data-rk-modal="newsletter" role="dialog" aria-modal="true"
     aria-labelledby="rk-nl-title" hidden>
  <div class="rk-modal__dialog">
    <button class="rk-modal__close" type="button" aria-label="Zamknij" data-rk-modal-close>&times;
    </button>

    <div data-view="form">
      <span class="rk-modal__badge">-10%</span>
      <h2 class="rk-modal__title" id="rk-nl-title">Dołącz do newslettera</h2>
      <p class="rk-modal__lead">Zapisz się i odbierz rabat na pierwsze zakupy oraz dostęp do ofert
        przed wszystkimi.</p>
      <form novalidate>
        <input class="rk-modal__input" type="email" name="email" placeholder="Twój adres e-mail"
               autocomplete="email" aria-label="Adres e-mail">
        <label class="rk-modal__consent">
          <input type="checkbox" name="consent">
          <span>Wyrażam zgodę na otrzymywanie newslettera i akceptuję regulamin.</span>
        </label>
        <p class="rk-modal__error" role="alert"></p>
        <button class="rk-modal__submit" type="submit">Zapisz się i odbierz kod</button>
      </form>
    </div>

    <div data-view="done" hidden>
      <span class="rk-modal__badge">Gotowe</span>
      <h2 class="rk-modal__title">Dziękujemy za zapis!</h2>
      <p class="rk-modal__lead">Twój kod rabatowy:</p>
      <div class="rk-modal__code">WELCOME10</div>
      <p class="rk-modal__small">Wysłaliśmy go także na <span data-sent-to></span>.</p>
    </div>
  </div>
</div>

<script>
  (function () {
    var bar = document.querySelector('[data-rk-bar="newsletter"]');
    var modal = document.querySelector('[data-rk-modal="newsletter"]');
    if (!bar || !modal) return;

    var KEY = 'rk_bar_newsletter_closed';
    var form = modal.querySelector('form');
    var email = modal.querySelector('input[type="email"]');
    var consent = modal.querySelector('input[type="checkbox"]');
    var error = modal.querySelector('.rk-modal__error');
    var viewForm = modal.querySelector('[data-view="form"]');
    var viewDone = modal.querySelector('[data-view="done"]');
    var sentTo = modal.querySelector('[data-sent-to]');
    var lastFocus = null;
    var subscribed = false;

    function track(name, data) {
      data = data || {};
      if (typeof window.track === 'function') window.track(name, data);
      else console.log('[rk-bar]', name, data);
    }

    function isClosed() {
      try {
        return sessionStorage.getItem(KEY) === '1';
      } catch (e) {
        return false;
      }
    }

    function setClosed() {
      try {
        sessionStorage.setItem(KEY, '1');
      } catch (e) {
      }
    }

    function hideBar() {
      bar.hidden = true;
      setClosed();
    }

    function openModal() {
      lastFocus = document.activeElement;
      modal.hidden = false;
      document.documentElement.style.overflow = 'hidden';
      email.focus();
      track('popup.view', {popup: 'newsletter'});
    }

    function closeModal() {
      modal.hidden = true;
      document.documentElement.style.overflow = '';
      track('popup.close', {popup: 'newsletter', subscribed: subscribed});
      if (subscribed) hideBar();
      else if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    if (isClosed()) bar.hidden = true;
    else track('bar.view', {bar: 'newsletter'});

    bar.querySelector('[data-rk-open]').addEventListener('click', function () {
      track('bar.click', {bar: 'newsletter'});
      openModal();
    });
    bar.querySelector('[data-rk-close]').addEventListener('click', function () {
      track('bar.close', {bar: 'newsletter'});
      hideBar();
    });
    modal.querySelector('[data-rk-modal-close]').addEventListener('click', closeModal);
    modal.addEventListener('click', function (e) {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', function (e) {
      if (modal.hidden) return;
      if (e.key === 'Escape') {
        closeModal();
        return;
      }
      if (e.key !== 'Tab') return;
      // Keep focus inside the dialog.
      var items = Array.prototype.filter.call(
        modal.querySelectorAll('button, input, a[href]'),
        function (el) {
          return !el.disabled && el.offsetParent !== null;
        }
      );
      if (!items.length) return;
      var first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var value = email.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)) {
        error.textContent = 'Podaj poprawny adres e-mail.';
        email.focus();
        return;
      }
      if (!consent.checked) {
        error.textContent = 'Zaznacz zgodę, aby zapisać się do newslettera.';
        return;
      }
      error.textContent = '';
      subscribed = true;
      sentTo.textContent = value;
      viewForm.hidden = true;
      viewDone.hidden = false;
      track('newsletter.subscribe', {email: value, source: 'bar+popup'});
    });
  })();
</script>
