<!-- =====================================================================
     Mock: shop product page (PDP)
     Grey skeleton .roi-bg = blurred & dimmed; ROI frame stays sharp on top.
     Layout: header → breadcrumbs → gallery + product info → ROI frame → description → footer
     Slots: frameLabel, widget – in double braces
     ===================================================================== -->
<style>
  /* Mock styles – --roi-* variables only */
  .mk-top { background: var(--roi-skeleton-surface); border-bottom: 1px solid var(--roi-skeleton); }
  .mk-top__in { max-width: var(--roi-max-width); margin: 0 auto; padding: 14px var(--roi-gutter); display: flex; align-items: center; gap: 24px; }
  .mk-logo { width: 110px; height: 28px; flex: none; }
  .mk-nav { display: none; gap: 20px; flex: 1; }
  .mk-nav .sk { width: 70px; height: 12px; }
  .mk-search { display: none; width: 260px; height: 34px; }
  .mk-icons { display: flex; gap: 10px; margin-left: auto; }
  .mk-icons .sk { width: 26px; height: 26px; }

  .mk-crumbs { display: flex; align-items: center; gap: 10px; margin: 16px 0 20px; }
  .mk-crumbs .sk { height: 10px; width: 64px; }
  .mk-crumbs .sk:last-child { width: 110px; }

  .mk-pdp { display: grid; grid-template-columns: 1fr; gap: 24px; }
  .mk-gal__main { aspect-ratio: 1; }
  .mk-gal__thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
  .mk-gal__thumb { aspect-ratio: 1; }

  .mk-info > * + * { margin-top: 14px; }
  .mk-brand { width: 90px; height: 10px; }
  .mk-title { width: 85%; height: 22px; }
  .mk-title--2 { width: 55%; }
  .mk-rating { display: flex; align-items: center; gap: 6px; }
  .mk-rating .sk--round { width: 14px; height: 14px; }
  .mk-rating .txt { width: 70px; height: 10px; margin-left: 6px; }
  .mk-price { display: flex; align-items: baseline; gap: 12px; }
  .mk-price .now { width: 110px; height: 26px; }
  .mk-price .old { width: 64px; height: 14px; }
  .mk-opt-label { width: 60px; height: 10px; }
  .mk-swatches { display: flex; gap: 10px; }
  .mk-swatches .sk { width: 34px; height: 34px; }
  .mk-sizes { display: flex; flex-wrap: wrap; gap: 8px; }
  .mk-sizes .sk { width: 52px; height: 36px; }
  .mk-buy { display: flex; gap: 10px; }
  .mk-qty { width: 96px; height: 48px; flex: none; }
  .mk-cta { flex: 1; height: 48px; }
  .mk-perks > * + * { margin-top: 10px; }
  .mk-perks .sk { height: 10px; }
  .mk-perks .sk:nth-child(1) { width: 70%; }
  .mk-perks .sk:nth-child(2) { width: 55%; }
  .mk-acc { border-top: 1px solid var(--roi-skeleton); padding-top: 14px; }
  .mk-acc .sk { height: 12px; width: 40%; }
  .mk-acc + .mk-acc { margin-top: 14px; }

  .mk-desc { margin-top: 40px; }
  .mk-tabs { display: flex; gap: 20px; margin-bottom: 20px; }
  .mk-tabs .sk { width: 90px; height: 14px; }
  .mk-lines > * + * { margin-top: 10px; }
  .mk-lines .sk { height: 10px; }
  .mk-lines .sk:nth-child(3n + 1) { width: 100%; }
  .mk-lines .sk:nth-child(3n + 2) { width: 92%; }
  .mk-lines .sk:nth-child(3n) { width: 60%; }

  .mk-foot { margin-top: 40px; padding: 32px var(--roi-gutter); background: var(--roi-skeleton-surface); }
  .mk-foot__in { max-width: var(--roi-max-width); margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .mk-foot .sk { height: 10px; margin-bottom: 10px; }

  @media (min-width: 640px) {
    .mk-foot__in { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 768px) {
    .mk-pdp { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; }
  }
  @media (min-width: 1024px) {
    .mk-nav { display: flex; }
    .mk-search { display: block; }
  }

  .roi-frame {
    padding: 0;
  }
</style>

<!-- ROI frame with the widget (right below the buy box: cross-sell, similar, last seen) -->
<div class="roi-frame">
  <span class="roi-frame__label">{{frameLabel}}</span>
  {{widget}}
</div>

<header class="mk-top roi-bg" aria-hidden="true">
  <div class="mk-top__in">
    <div class="sk sk--strong mk-logo"></div>
    <nav class="mk-nav"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></nav>
    <div class="sk sk--pill mk-search"></div>
    <div class="mk-icons"><div class="sk sk--round"></div><div class="sk sk--round"></div><div class="sk sk--round"></div></div>
  </div>
</header>

<main class="roi-page">
  <div class="roi-bg" aria-hidden="true">
    <div class="mk-crumbs"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>

    <div class="mk-pdp">
      <!-- Gallery -->
      <div class="mk-gal">
        <div class="sk mk-gal__main"></div>
        <div class="mk-gal__thumbs">
          <div class="sk mk-gal__thumb"></div><div class="sk mk-gal__thumb"></div>
          <div class="sk mk-gal__thumb"></div><div class="sk mk-gal__thumb"></div>
        </div>
      </div>

      <!-- Product info -->
      <div class="mk-info">
        <div class="sk mk-brand"></div>
        <div>
          <div class="sk sk--strong mk-title"></div>
          <div class="sk sk--strong mk-title mk-title--2" style="margin-top:10px"></div>
        </div>
        <div class="mk-rating">
          <div class="sk sk--round"></div><div class="sk sk--round"></div><div class="sk sk--round"></div>
          <div class="sk sk--round"></div><div class="sk sk--round"></div>
          <div class="sk txt"></div>
        </div>
        <div class="mk-price"><div class="sk sk--strong now"></div><div class="sk old"></div></div>

        <div class="sk mk-opt-label"></div>
        <div class="mk-swatches"><div class="sk sk--round"></div><div class="sk sk--round"></div><div class="sk sk--round"></div><div class="sk sk--round"></div></div>

        <div class="sk mk-opt-label"></div>
        <div class="mk-sizes"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>

        <div class="mk-buy">
          <div class="sk sk--pill mk-qty"></div>
          <div class="sk sk--strong sk--pill mk-cta"></div>
        </div>

        <div class="mk-perks"><div class="sk"></div><div class="sk"></div></div>
        <div class="mk-acc"><div class="sk"></div></div>
        <div class="mk-acc"><div class="sk"></div></div>
      </div>
    </div>
  </div>

  <div class="roi-bg" aria-hidden="true">
    <div class="mk-desc">
      <div class="mk-tabs"><div class="sk sk--strong"></div><div class="sk"></div><div class="sk"></div></div>
      <div class="mk-lines">
        <div class="sk"></div><div class="sk"></div><div class="sk"></div>
        <div class="sk"></div><div class="sk"></div><div class="sk"></div>
      </div>
    </div>
  </div>
</main>

<footer class="mk-foot roi-bg" aria-hidden="true">
  <div class="mk-foot__in">
    <div><div class="sk" style="width:60%"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:50%"></div></div>
    <div><div class="sk" style="width:60%"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:40%"></div></div>
    <div><div class="sk" style="width:50%"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:60%"></div></div>
    <div><div class="sk" style="width:70%"></div><div class="sk" style="width:50%"></div><div class="sk" style="width:60%"></div></div>
  </div>
</footer>
