<!-- =====================================================================
     Mock: shop product page (generic – used by any product-page widget)
     Grey skeleton .roi-bg = page context; ROI frame + highlight from core/presentation.css.
     The anchor product (build entry "anchor") is shown for real: image, category, name, price.
     Without an anchor the product section is a skeleton (class no-anchor).
     Slots in double braces: frameLabel, widget, anchorState, anchorName, anchorCategory,
     anchorImage, anchorPrice, anchorOldPrice, anchorDiscount
     ===================================================================== -->
<style>
  /* Skeleton: --roi-* variables only. The anchor product uses theme variables (shop look). */
  .mk-top { background: var(--roi-skeleton-surface); border-bottom: 1px solid var(--roi-skeleton); }
  .mk-top__in { max-width: var(--roi-max-width); margin: 0 auto; padding: 14px var(--roi-gutter); display: flex; align-items: center; gap: 24px; }
  .mk-logo { width: 110px; height: 28px; flex: none; }
  .mk-nav { display: none; gap: 20px; flex: 1; }
  .mk-nav .sk { width: 70px; height: 12px; }
  .mk-search { display: none; width: 260px; height: 34px; }
  .mk-icons { display: flex; gap: 10px; margin-left: auto; }
  .mk-icons .sk { width: 26px; height: 26px; }

  .mk-crumbs { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  .mk-crumbs .sk { height: 10px; }

  /* Product section: stacked on mobile, gallery | info from 768px */
  .mk-pdp { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .mk-pdp.no-anchor .mk-a,
  .mk-pdp.has-anchor .mk-na { display: none; }

  .mk-gal__main { aspect-ratio: 1; }
  .mk-gal__frame { background: var(--roi-skeleton-surface); border: 1px solid var(--roi-skeleton); border-radius: 6px; overflow: hidden; }
  .mk-gal__img { width: 100%; height: 100%; object-fit: contain; }
  .mk-gal__thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .mk-gal__thumbs > * { aspect-ratio: 1; }

  .mk-info { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .mk-info__real { display: flex; flex-direction: column; gap: 8px; }
  .mk-cat { margin: 0; color: var(--color-text-muted); font-family: var(--font-body); font-size: var(--font-size-sm); }
  .mk-name { margin: 0; color: var(--color-text); font-family: var(--font-heading); font-size: var(--font-size-title); font-weight: var(--font-weight-title); line-height: 1.2; }
  .mk-price-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-family: var(--font-body); }
  .mk-price { color: var(--color-text); font-size: calc(var(--font-size-price) * 1.4); font-weight: var(--font-weight-price); white-space: nowrap; }
  .mk-price-row:has(.mk-old:not(:empty)) .mk-price { color: var(--color-price-sale); }
  .mk-old { color: var(--color-price-old); font-size: var(--font-size-base); white-space: nowrap; }
  .mk-disc { color: var(--color-price-sale); font-size: var(--font-size-base); font-weight: 700; }
  .mk-old:empty, .mk-disc:empty { display: none; }

  .mk-info__sk { display: flex; flex-direction: column; gap: 10px; }
  .mk-line { height: 12px; }
  .mk-vars { display: flex; flex-wrap: wrap; gap: 8px; }
  .mk-vars .sk { width: 64px; height: 32px; }
  .mk-cta { height: 48px; width: 100%; max-width: 360px; }
  .mk-desc { display: flex; flex-direction: column; gap: 10px; }
  .mk-desc .sk { height: 10px; }

  .mk-tabs { display: flex; gap: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--roi-skeleton); }
  .mk-tabs .sk { width: 90px; height: 14px; }
  .mk-more { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; margin-top: 20px; }
  .mk-more .sk { height: 10px; margin-bottom: 10px; }
  .mk-spec { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }

  .mk-foot { margin-top: 40px; padding: 32px var(--roi-gutter); background: var(--roi-skeleton-surface); }
  .mk-foot__in { max-width: var(--roi-max-width); margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .mk-foot .sk { height: 10px; margin-bottom: 10px; }

  @media (min-width: 640px) {
    .mk-foot__in { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 768px) {
    .mk-pdp { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; align-items: start; }
    .mk-more { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 40px; }
  }
  @media (min-width: 1024px) {
    .mk-nav { display: flex; }
    .mk-search { display: block; }
  }
</style>

<header class="mk-top roi-bg" aria-hidden="true">
  <div class="mk-top__in">
    <div class="sk sk--strong mk-logo"></div>
    <nav class="mk-nav"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></nav>
    <div class="sk sk--pill mk-search"></div>
    <div class="mk-icons"><div class="sk sk--round"></div><div class="sk sk--round"></div><div class="sk sk--round"></div></div>
  </div>
</header>

<main class="roi-page">
  <div class="mk-crumbs roi-bg" aria-hidden="true">
    <div class="sk" style="width:48px"></div><div class="sk" style="width:80px"></div>
    <div class="sk" style="width:96px"></div><div class="sk" style="width:120px"></div>
  </div>

  <!-- Product section: real anchor product (.mk-a) or skeleton (.mk-na) -->
  <section class="mk-pdp {{anchorState}}">
    <div class="mk-gal">
      <div class="mk-gal__main mk-gal__frame mk-a">
        <img class="mk-gal__img" src="{{anchorImage}}" alt="{{anchorName}}" width="600" height="600">
      </div>
      <div class="mk-gal__main sk mk-na" aria-hidden="true"></div>
      <div class="mk-gal__thumbs roi-bg" aria-hidden="true">
        <div class="mk-gal__frame mk-a"><img class="mk-gal__img" src="{{anchorImage}}" alt="" width="120" height="120"></div>
        <div class="sk mk-na"></div>
        <div class="sk"></div><div class="sk"></div><div class="sk"></div>
      </div>
    </div>

    <div class="mk-info">
      <div class="mk-info__real mk-a">
        <p class="mk-cat">{{anchorCategory}}</p>
        <h1 class="mk-name">{{anchorName}}</h1>
        <p class="mk-price-row">
          <span class="mk-price">{{anchorPrice}}</span>
          <s class="mk-old">{{anchorOldPrice}}</s>
          <span class="mk-disc">{{anchorDiscount}}</span>
        </p>
      </div>
      <div class="mk-info__sk mk-na roi-bg" aria-hidden="true">
        <div class="sk mk-line" style="width:30%"></div>
        <div class="sk sk--strong" style="width:80%;height:24px"></div>
        <div class="sk sk--strong" style="width:35%;height:22px"></div>
      </div>

      <div class="mk-info__sk roi-bg" aria-hidden="true">
        <div class="sk mk-line" style="width:25%"></div>
        <div class="mk-vars"><div class="sk sk--pill"></div><div class="sk sk--pill"></div><div class="sk sk--pill"></div><div class="sk sk--pill"></div></div>
        <div class="sk sk--strong mk-cta"></div>
        <div class="mk-desc">
          <div class="sk" style="width:95%"></div><div class="sk" style="width:88%"></div>
          <div class="sk" style="width:92%"></div><div class="sk" style="width:60%"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ROI frame with the widget -->
  <div class="roi-frame">
    <span class="roi-frame__label">{{frameLabel}}</span>
    {{widget}}
  </div>

  <div class="roi-bg" aria-hidden="true">
    <div class="mk-tabs"><div class="sk sk--strong"></div><div class="sk"></div><div class="sk"></div></div>
    <div class="mk-more">
      <div>
        <div class="sk" style="width:96%"></div><div class="sk" style="width:90%"></div><div class="sk" style="width:94%"></div>
        <div class="sk" style="width:85%"></div><div class="sk" style="width:70%"></div>
      </div>
      <div class="mk-spec">
        <div class="sk" style="width:70%"></div><div class="sk" style="width:50%"></div>
        <div class="sk" style="width:60%"></div><div class="sk" style="width:40%"></div>
        <div class="sk" style="width:75%"></div><div class="sk" style="width:55%"></div>
        <div class="sk" style="width:65%"></div><div class="sk" style="width:45%"></div>
      </div>
    </div>
  </div>
</main>

<footer class="mk-foot roi-bg" aria-hidden="true">
  <div class="mk-foot__in">
    <div><div class="sk" style="width:60%"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:50%"></div></div>
    <div><div class="sk" style="width:60%"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:40%"></div></div>
    <div><div class="sk" style="width:50%"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:60%"></div></div>
    <div><div class="sk" style="width:70%"></div><div class="sk" style="width:50%"></div><div class="sk" style="width:60%"></div></div>
  </div>
</footer>
