<!-- =====================================================================
     Mock: shop "page not found" (404) – generic, used by any widget
     Grey skeleton .roi-bg = page context; ROI frame + highlight from core/presentation.css.
     The error message is real shop content (theme variables): 404, heading, description,
     search field (look only) and two buttons (click = "W realnym wdrożeniu: …" toast).
     Slots in double braces: frameLabel, widget
     The script at the end shows the toasts – it doesn't know which widget sits in the frame.
     ===================================================================== -->
<style>
  /* Skeleton: --roi-* variables only. The error message uses theme variables (shop look). */
  .mk-top { background: var(--roi-skeleton-surface); border-bottom: 1px solid var(--roi-skeleton); }
  .mk-top__in { max-width: var(--roi-max-width); margin: 0 auto; padding: 14px var(--roi-gutter); display: flex; align-items: center; gap: 24px; }
  .mk-logo { width: 110px; height: 28px; flex: none; }
  .mk-nav { display: none; gap: 20px; flex: 1; }
  .mk-nav .sk { width: 70px; height: 12px; }
  .mk-topsearch { display: none; width: 260px; height: 34px; }
  .mk-icons { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .mk-icons .sk { width: 26px; height: 26px; }

  .mk-crumbs { display: flex; gap: 8px; margin: 16px 0 0; }
  .mk-crumbs .sk { width: 60px; height: 10px; }

  /* Error message (real content) */
  .mk-err {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    max-width: 560px; margin: 32px auto 8px; text-align: center; font-family: var(--font-body);
  }
  .mk-err__code {
    margin: 0; color: var(--color-accent); font-family: var(--font-heading);
    font-size: clamp(72px, 12vw + 24px, 140px); font-weight: 700; line-height: 1; letter-spacing: 0.04em;
  }
  .mk-err__title {
    margin: 0; color: var(--color-text); font-family: var(--font-heading);
    font-size: var(--font-size-title); font-weight: var(--font-weight-title); line-height: 1.2;
  }
  .mk-err__text { margin: 0; color: var(--color-text-muted); font-size: var(--font-size-base); line-height: var(--line-height-base); }

  .mk-err__search { display: flex; width: 100%; margin-top: 8px; }
  .mk-err__input {
    flex: 1; min-width: 0; height: 48px; padding: 0 16px;
    background: var(--color-bg); color: var(--color-text);
    font-family: var(--font-body); font-size: var(--font-size-base);
    border: 1px solid var(--color-border); border-right: 0; border-radius: var(--radius-cta) 0 0 var(--radius-cta);
  }
  .mk-err__input::placeholder { color: var(--color-text-muted); }
  .mk-err__input:focus-visible { outline: 2px solid var(--color-focus); outline-offset: -1px; }
  .mk-err__submit {
    display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 48px; padding: 0; flex: none;
    background: var(--color-cta-bg); color: var(--color-cta-text);
    border: 0; border-radius: 0 var(--radius-cta) var(--radius-cta) 0; cursor: pointer;
    transition: background var(--transition-fast);
  }
  .mk-err__submit svg { width: 20px; height: 20px; }

  .mk-err__actions { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 8px; }
  .mk-btn {
    display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px;
    font-family: var(--font-body); font-size: var(--font-size-base); font-weight: 700; text-decoration: none;
    border: 1px solid var(--color-cta-bg); border-radius: var(--radius-cta); cursor: pointer;
    transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
  }
  .mk-btn--primary { background: var(--color-cta-bg); color: var(--color-cta-text); }
  .mk-btn--secondary { background: var(--color-bg); color: var(--color-text); }
  .mk-btn:focus-visible,
  .mk-err__submit:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .mk-btn--primary:hover, .mk-err__submit:hover { background: var(--color-cta-hover-bg); border-color: var(--color-cta-hover-bg); }
    .mk-btn--secondary:hover { background: var(--color-surface); }
  }

  .mk-frame { min-width: 0; }

  /* Footer skeleton */
  .mk-foot { margin-top: 40px; padding: 32px var(--roi-gutter); background: var(--roi-skeleton-surface); }
  .mk-foot__in { max-width: var(--roi-max-width); margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .mk-foot .sk { height: 10px; margin-bottom: 10px; }

  @media (min-width: 640px) {
    .mk-err { margin-top: 48px; }
    .mk-err__actions { flex-direction: row; justify-content: center; }
    .mk-err__actions .mk-btn { flex: 1; }
    .mk-foot__in { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 1024px) {
    .mk-nav { display: flex; }
    .mk-topsearch { display: block; }
    .mk-err { margin-top: 64px; }
  }
</style>

<header class="mk-top roi-bg">
  <div class="mk-top__in">
    <div class="sk sk--strong mk-logo" aria-hidden="true"></div>
    <nav class="mk-nav" aria-hidden="true"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></nav>
    <div class="sk sk--pill mk-topsearch" aria-hidden="true"></div>
    <div class="mk-icons" aria-hidden="true">
      <div class="sk sk--round"></div><div class="sk sk--round"></div>
    </div>
  </div>
</header>

<main class="roi-page">
  <div class="mk-crumbs roi-bg" aria-hidden="true"><div class="sk"></div><div class="sk"></div></div>

  <!-- Error message (real content) -->
  <section class="mk-err" aria-labelledby="mk-err-title" data-mk-err>
    <p class="mk-err__code" aria-hidden="true">404</p>
    <h1 class="mk-err__title" id="mk-err-title">Ups, tej strony nie ma</h1>
    <p class="mk-err__text">Strona mogła zostać przeniesiona albo link jest nieaktualny</p>
    <form class="mk-err__search" role="search" data-mk-search>
      <label class="roi-visually-hidden" for="mk-err-q">Szukaj w sklepie</label>
      <input class="mk-err__input" id="mk-err-q" type="search" name="q" placeholder="Czego szukasz?" autocomplete="off">
      <button class="mk-err__submit" type="submit" aria-label="Szukaj">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
    </form>
    <div class="mk-err__actions">
      <a class="mk-btn mk-btn--primary" href="#" data-mk-toast="W realnym wdrożeniu: przejście na stronę główną">Wróć na stronę główną</a>
      <a class="mk-btn mk-btn--secondary" href="#" data-mk-toast="W realnym wdrożeniu: przejście do listy kategorii">Zobacz kategorie</a>
    </div>
  </section>

  <!-- ROI frame with the widget -->
  <div class="mk-frame">
    <div class="roi-frame">
      <span class="roi-frame__label">{{frameLabel}}</span>
      {{widget}}
    </div>
  </div>
</main>

<footer class="mk-foot roi-bg" aria-hidden="true">
  <div class="mk-foot__in">
    <div><div class="sk" style="width:60%"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:50%"></div></div>
    <div><div class="sk" style="width:60%"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:40%"></div></div>
    <div><div class="sk" style="width:50%"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:60%"></div></div>
    <div><div class="sk" style="width:70%"></div><div class="sk" style="width:50%"></div><div class="sk" style="width:60%"></div></div>
  </div>
</footer>

<script>
  (() => {
    'use strict';
    // Demo buttons: same toast element as the widgets (#roi-toast from page-shell, after the mock)
    let toastTimer;
    const toast = (message) => {
      const el = document.getElementById('roi-toast');
      if (!el) return;
      el.textContent = message;
      el.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('is-visible'), 2600);
    };

    const err = document.querySelector('[data-mk-err]');
    err.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-mk-toast]');
      if (!btn) return;
      e.preventDefault(); // demo: no navigation
      toast(btn.dataset.mkToast);
    });
    // Search: look only
    err.querySelector('[data-mk-search]').addEventListener('submit', (e) => e.preventDefault());
  })();
</script>
